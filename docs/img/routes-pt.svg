<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="Duas rotas para fora, uma língua para dentro">
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa0aa"/></marker></defs>
<rect width="940" height="470" rx="10" fill="#16181d"/>
<text x="24" y="36" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="19" font-weight="600" fill="#e8eaed" text-anchor="start">Duas rotas para fora, uma língua para dentro</text>
<rect x="330" y="62" width="280" height="42" rx="8" fill="#1c1f26" stroke="#e8eaed" stroke-opacity="0.55"/>
<text x="346" y="89" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaed" text-anchor="start">Stream Deck</text>
<text x="346" y="108" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0aa" text-anchor="start"></text>
<path d="M470 104 L470 140" stroke="#9aa0aa" stroke-width="1.6" marker-end="url(#tip)"/>
<text x="482" y="126" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#9aa0aa" text-anchor="start">SDK v2 (WebSocket)</text>
<rect x="330" y="140" width="280" height="70" rx="8" fill="#1c1f26" stroke="#5aa9e6" stroke-opacity="0.55"/>
<text x="346" y="167" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaed" text-anchor="start">Plugin (TypeScript)</text>
<text x="346" y="186" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0aa" text-anchor="start">processo residente · desenha as teclas</text>
<path d="M470 210 L470 246" stroke="#9aa0aa" stroke-width="1.6" marker-end="url(#tip)"/>
<text x="482" y="232" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="11" font-weight="400" fill="#9aa0aa" text-anchor="start">spawn + stdin/stdout, JSONL</text>
<rect x="330" y="246" width="280" height="70" rx="8" fill="#1c1f26" stroke="#5aa9e6" stroke-opacity="0.55"/>
<text x="346" y="273" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaed" text-anchor="start">Worker (Python)</text>
<text x="346" y="292" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0aa" text-anchor="start">processo filho · dono das conexões</text>
<path d="M330 281 L188 281 L188 334" stroke="#ffb02e" stroke-width="1.8" fill="none" marker-end="url(#tip)"/>
<path d="M610 281 L752 281 L752 334" stroke="#9aa0aa" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#tip)"/>
<rect x="24" y="334" width="328" height="80" rx="8" fill="#1c1f26" stroke="#ffb02e" stroke-opacity="0.55"/>
<text x="40" y="361" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaed" text-anchor="start">Sua rede</text>
<text x="40" y="380" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0aa" text-anchor="start">TCP 6668 + AES, uma conexão aberta por</text>
<text x="40" y="394" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0aa" text-anchor="start">aparelho</text>
<rect x="588" y="334" width="328" height="80" rx="8" fill="#1c1f26" stroke="#9aa0aa" stroke-opacity="0.55"/>
<text x="604" y="361" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaed" text-anchor="start">Serviço da conta</text>
<text x="604" y="380" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0aa" text-anchor="start">sessão + MQTT, só para quem recusa conexão</text>
<text x="604" y="394" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0aa" text-anchor="start">local</text>
<text x="318" y="274" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffb02e" text-anchor="end">101 ms de mediana</text>
<text x="622" y="274" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="12" font-weight="600" fill="#9aa0aa" text-anchor="start">~250 ms de mediana</text>
<text x="24" y="438" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0aa" text-anchor="start">As duas rotas devolvem os status codes do próprio aparelho. Só o protocolo local usa data points numéricos, e esse</text>
<text x="24" y="452" font-family="Segoe UI, Ubuntu, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#9aa0aa" text-anchor="start">mapa vem da API — nunca é adivinhado.</text>
</svg>